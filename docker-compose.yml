services:
  gcs-connector:
    image: gcs-connector:latest
    container_name: GCSConnector

    environment:
      - ZEEBE_CLIENT_BROKER_GATEWAY_ADDRESS=zeebe:26500
      - ZEEBE_CLIENT_SECURITY_PLAINTEXT=true
      - CAMUNDA_CONNECTOR_POLLING_ENABLED=false
      - CAMUNDA_CONNECTOR_WEBHOOK_ENABLED=false
      - SPRING_MAIN_WEB_APPLICATION_TYPE=none
      - OPERATE_CLIENT_ENABLED=false
      - GOOGLE_APPLICATION_CREDENTIALS=provide path in container to credentials JSON key
  
    volumes:
      - type: bind
        source: provide directory in local storage
        target: provide directory in docker container
    networks:
      - camunda-platform

networks:
  camunda-platform:
    external: true
